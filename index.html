<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOTA-JOTI Camera · Kalgoorlie Scout Group</title>
<meta name="description" content="Take photos and videos during JOTA-JOTI, complete challenges and send them to the organisers.">
<meta name="theme-color" content="#0d0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JOTA Camera">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="boot" aria-live="polite"><img src="logo.png" alt="JOTA-JOTI"><strong>JOTA-JOTI Camera</strong><span>Loading…</span></div>
<div id="app">
  <header id="topbar" hidden>
    <img class="logo" src="logo.png" alt="">
    <span class="title">JOTA-JOTI</span>
    <span class="spacer"></span>
    <span class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Online</span></span>
    <button class="who" id="who" aria-label="Settings"></button>
  </header>
  <main id="views">
    <section class="view fill" id="v-onboard" aria-label="Welcome"></section>
    <section class="view fill" id="v-camera" aria-label="Camera"></section>
    <section class="view fill" id="v-review" aria-label="Review"></section>
    <section class="view" id="v-submit" aria-label="Submit"></section>
    <section class="view fill" id="v-map" aria-label="Map"></section>
    <section class="view" id="v-challenges" aria-label="Challenges"></section>
    <section class="view fill" id="v-posts" aria-label="My posts"></section>
    <section class="view" id="v-settings" aria-label="Settings"></section>
  </main>
  <nav id="nav" hidden aria-label="Main"></nav>
<footer class="site-credit">Made by Hunter Miller from Boulder Scout Hall</footer>
</div>
<noscript><p style="padding:24px;color:#fff">JOTA-JOTI Camera needs JavaScript. Please turn it on in your browser settings.</p></noscript>
<script type="module" src="main.js"></script>
<script>
window.addEventListener('error', function(e){
  var b=document.getElementById('boot');
  if(!b || b.classList.contains('gone') || !e) return;
  if(e.filename && /\.js(?:\?|$)/.test(e.filename)) {
    b.dataset.warning='1';
    var span=b.querySelector('span');
    if(span) span.textContent='The app hit a startup error. Please reload the page.';
  }
});
window.addEventListener('unhandledrejection', function(e){
  var b=document.getElementById('boot');
  if(b && !b.classList.contains('gone')) b.dataset.warning='1';
});
setTimeout(function(){
  var b=document.getElementById('boot');
  if(b && !b.classList.contains('gone')) {
    var span=b.querySelector('span');
    if(span) span.textContent='Still loading. You can reload safely.';
  }
}, 12000);
</script>
</body>
</html>
