<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JOTA-JOTI</title>
<style>
html,body{margin:0;min-height:100%;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#1d2733}
.box{min-height:100vh;display:grid;place-items:center;text-align:center}.box div{padding:24px}.box strong{font-size:20px}.box p{color:#566170}.box a{display:inline-block;margin-top:8px;color:#5a2c84;font-weight:700}
</style>
<script>
(function(){
  var path=location.pathname.replace(/\/+$/,'');
  var parts=path.split('/').filter(Boolean);
  var routes=['camera','map','challenges','posts','settings','review','submit'];
  var last=(parts[parts.length-1]||'').toLowerCase();
  var isGitHub=location.hostname.endsWith('github.io');
  if(last==='admin'){
    var adminBase='/' + parts.slice(0,-1).join('/') + '/';
    location.replace(adminBase+'admin.html'+location.search);
    return;
  }
  if(routes.indexOf(last)>=0){
    var base='/' + parts.slice(0,-1).join('/');
    if(base!=='/') base+='/';
    location.replace(base+location.search+'#/'+last);
    return;
  }
  var root=isGitHub && parts.length ? '/' + parts[0] + '/' : '/';
  location.replace(root+location.search+location.hash);
})();
</script>
</head>
<body><div class="box"><div><strong>JOTA-JOTI</strong><p>Opening the app…</p><a href="./">Continue</a></div></div></body>
</html>
