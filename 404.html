<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JOTA-JOTI</title>
<style>body{margin:0;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#26333b;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,90vw);text-align:center;padding:24px}.box a{color:#5a2c84;font-weight:700}</style>
<script>
(function(){
  var p=location.pathname.replace(/\\/+$/,'');
  var parts=p.split('/').filter(Boolean);
  var root = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
  var tail = p.slice(root.replace(/\\/$/,'').length) || '/';
  if (/^\\/admin$/i.test(tail) || /^\\/admin\\/$/i.test(location.pathname.slice(root.length))) {
    location.replace(root + 'admin.html' + location.search + location.hash);
    return;
  }
  location.replace(root + location.search + location.hash);
})();
</script>
</head>
<body><div class="box"><strong>JOTA-JOTI</strong><p>Opening the app…</p><a href="./">Continue</a></div></body>
</html>
